<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css" href='https://fonts.googleapis.com/css?family=Montserrat'>



    <title>Tela Inicial</title>
</head>

<body>

    <div class="Menu">
        <div class="img">
            <img src="./../pic/simbolo.png" style="float:left;width:140px;height:140px; border-radius: 50%; margin:10px;  ">
            <br><br>
            <h1 style=" margin-top: 10px; height:30px; margin-left: 20px"> Bem Vindo/a ao ORA!</h1>
            <h3>Observatório de Restrições Alimentares!</h3>
        </div>

        <div class="pesquisa">
            <input class="login1" type="text" placeholder="Pesquisar">
            <div id="iconsp"></div>
            <br><br>
        </div>

        <div class="usuario">
            <div id="iconsU"></div>
        </div>

        <div class="filtro">
            <h2>Pesquisar por Restrição:</h2>
            <div class="botoes-filtro">
                <button class="botao"><img src="./../pic/celiaco.png" alt="Celíaca"
                "><br>Celíaca</button>
                <button class="botao"><img src="./../pic/lactose.png" alt="Lactose"
                "><br>Lactose</button>
                <button class="botao"><img src="./../pic/diabetes.png" alt="Diabetes"
                "><br>Diabetes</button>
                <button class="botao"><img src="./../pic/hipertensao.png" alt="Hipertensão"
                "><br>Hipertensão</button>
                <button class="botao"><img src="./../pic/outros.png" alt="Tireóide"
                "><br>Tireóide</button>
                <button class="botao"><img src="./../pic/outros.png" alt="Alérgico"
                "><br>Alérgico</button>
                <button class="botao"><img src="./../pic/outros.png" alt="APLV"><br>APLV</button>
                <button class="botao"><img src="./../pic/outros.png" alt="Outros"><br>Outros</button>
            </div>
        </div>
        <div class="infos">
            <div class="servicos">
                <h3>Serviços em Destaque:</h3>
                <div class="carousel">
                    <input type="radio" name="carousel" id="slide1" checked>
                    <input type="radio" name="carousel" id="slide2">
                    <input type="radio" name="carousel" id="slide3">
                    <div class="slides">
                      <div class="slide">
                        <img src="./../pic/desligado.png" alt="Slide 1">
                      </div>
                      <div class="slide">
                        <img src="./../pic/simbolo.png" alt="Slide 2">
                      </div>
                      <div class="slide">
                        <img src="./../pic/desligado.png" alt="Slide 3">
                      </div>
                    </div>
                    <div class="navigation">
                      <label for="slide1"></label>
                      <label for="slide2"></label>
                      <label for="slide3"></label>
                    </div>
            </div>
            <div class="noticias">
                <h3>Notícias em Destaque:</h3>
                <div class="carousel">
                <input type="radio" name="carousel" id="slide1" checked>
                <input type="radio" name="carousel" id="slide2">
                <input type="radio" name="carousel" id="slide3">
                <div class="slides">
                  <div class="slide">
                    <img src="./../pic/desligado.png" alt="Slide 1">
                  </div>
                  <div class="slide">
                    <img src="./../pic/simbolo.png" alt="Slide 2">
                  </div>
                  <div class="slide">
                    <img src="./../pic/desligado.png" alt="Slide 3">
                  </div>
                </div>
                <div class="navigation">
                  <label for="slide1"></label>
                  <label for="slide2"></label>
                  <label for="slide3"></label>
                </div>
        </div>
            </div>
        </div>
        
        
                

    </div>
    <script src="script.js"></script>
</body>

</html>
